<!-- Последний блок T123, после разметки. Не требует библиотек. -->
<script>
/* После согласования: укажите HTTPS-ссылку на реальную продажу билетов.
   Пустая строка оставляет честное сообщение об уточнении информации. */
window.PUSHKIN_EXHIBIT_CONFIG = window.PUSHKIN_EXHIBIT_CONFIG || { ticketUrl: '' };
(function () {
  'use strict';
  var watcher;
  function init() {
    var root = document.getElementById('pushkin-exhibit');
    if (!root) return false;
    if (root.dataset.pxInitialized === 'true') return true;
    root.dataset.pxInitialized = 'true';
    root.classList.add('px-enhanced');
    var q = function (s) { return root.querySelector(s); };
    var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
    var mobile = window.matchMedia('(max-width:650px)');
    var manuallyCalm = false;
    var calm = function () { return reduce.matches || manuallyCalm; };
    var media = {};
    qa('[data-media]').forEach(function (box) {
      var id = box.getAttribute('data-media');
      media[id] = {box:box, video:box.querySelector('video'), button:box.querySelector('[data-play]'), requested:false, visible:false};
    });
    function label(item, text, icon) {
      item.button.querySelector('[data-play-label]').textContent = text;
      item.button.querySelector('.px-play-icon').textContent = icon || '▶';
      item.button.setAttribute('aria-label', text + ' — осенняя набережная');
    }
    function pause(item, user) {
      item.video.pause();
      if (user) item.requested = false;
      if (item.video.ended) label(item, 'Посмотреть ещё раз', '↻');
      else label(item, item.video.currentTime > 0 ? 'Продолжить' : 'Оживить картину');
    }
    function play(item, explicit) {
      if (!item || (!explicit && calm())) return;
      item.requested = true;
      var video = item.video;
      if (!video.getAttribute('src')) video.src = video.dataset.src;
      if (video.ended) video.currentTime = 0;
      label(item, 'Загрузка…', '◌');
      item.box.querySelector('.px-media-status').textContent = '';
      var result = video.play();
      if (result && result.catch) result.catch(function () {
        if (video.error) return;
        if (video.paused) label(item, 'Оживить картину');
      });
    }
    Object.keys(media).forEach(function (key) {
      var item = media[key];
      item.button.addEventListener('click', function () { if (item.video.paused) play(item, true); else pause(item, true); });
      item.video.addEventListener('playing', function () { item.video.classList.add('is-ready'); label(item, 'Остановить', 'Ⅱ'); });
      item.video.addEventListener('ended', function () { item.requested = false; label(item, 'Посмотреть ещё раз', '↻'); });
      item.video.addEventListener('error', function () {
        item.requested = false;
        item.video.classList.remove('is-ready');
        label(item, 'Повторить загрузку', '↻');
        item.box.querySelector('.px-media-status').textContent = 'Видео не загрузилось. Показано статичное изображение. Можно повторить загрузку.';
        item.video.removeAttribute('src');
      });
    });
    if ('IntersectionObserver' in window) {
      var mediaObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var item = media[entry.target.dataset.media];
          item.visible = entry.isIntersecting;
          if (!entry.isIntersecting) { pause(item, false); return; }
          if (item.requested && !calm() && !document.hidden) play(item, false);
        });
      }, {threshold:.2});
      Object.keys(media).forEach(function (key) { mediaObserver.observe(media[key].box); });
    }
    document.addEventListener('visibilitychange', function () {
      Object.keys(media).forEach(function (key) {
        var item = media[key];
        if (document.hidden) pause(item, false);
        else if (item.visible && item.requested && !calm()) play(item, false);
      });
    });
    var motion = q('.px-motion-toggle');
    function updateMotion() {
      root.classList.toggle('px-calm', calm());
      motion.setAttribute('aria-pressed', String(calm()));
      motion.textContent = reduce.matches ? 'Движение уменьшено в настройках устройства' : manuallyCalm ? 'Включить анимацию' : 'Остановить анимацию';
      motion.disabled = reduce.matches;
      if (calm()) {
        Object.keys(media).forEach(function (key) { pause(media[key], true); });
        stopSnow();
      }
    }
    motion.addEventListener('click', function () { manuallyCalm = !manuallyCalm; updateMotion(); });
    if (reduce.addEventListener) reduce.addEventListener('change', updateMotion);
    else reduce.addListener(updateMotion);
    var snow = q('.px-snow');
    var snowButton = q('[data-snow]');
    function stopSnow() {
      snow.classList.remove('is-playing');
      snowButton.setAttribute('aria-pressed', 'false');
      q('[data-snow-label]').textContent = 'Добавить снег';
    }
    snowButton.addEventListener('click', function () {
      if (calm()) { q('[data-snow-label]').textContent = 'Движение отключено'; return; }
      if (snow.classList.contains('is-playing')) { stopSnow(); return; }
      if (!snow.childElementCount) for (var i=0;i<32;i++) {
        var dot = document.createElement('i');
        var size = 2 + (i % 4);
        dot.style.cssText = 'left:'+((i*37)%101)+'%;width:'+size+'px;height:'+size+'px;opacity:'+(0.35+(i%6)*.1)+';--duration:'+(8+i%9)+'s;--delay:-'+(i%15)+'s';
        snow.appendChild(dot);
      }
      snow.classList.add('is-playing');
      snowButton.setAttribute('aria-pressed','true');
      q('[data-snow-label]').textContent = 'Остановить снег';
    });
    qa('[data-scene]').forEach(function (button) {
      button.addEventListener('click', function () {
        var winter = button.dataset.scene === 'winter';
        qa('[data-scene]').forEach(function (b) { var selected=b===button; b.setAttribute('aria-pressed',String(selected));b.classList.toggle('is-selected',selected); });
        q('.px-scene-autumn').hidden = winter;
        q('.px-scene-winter').hidden = !winter;
        q('.px-gallery').dataset.sceneView = button.dataset.scene;
        q('.px-gallery-number').textContent = winter ? '02 / 02' : '01 / 02';
        pause(media.autumn, true); stopSnow();
      });
    });
    var chapters = [
      ['Петербург / 1837','Мгновение до выстрела','Зимний город, дорога к Чёрной речке, снег. Из последнего дня история делает шаг назад — к детству, дружбе и первым стихам.','p-duel.jpg','Дмитрий Белюкин. «Дуэль Пушкина. Протаптывают тропинку»'],
      ['Москва / 1799–1811','Мир начинается с детства','Семья, первые впечатления и первые слова. На светлой странице проступает мир, в котором рождается будущий поэт.','p-child-full.jpg','Ксавье де Местр. «Пушкин-ребёнок»'],
      ['Царское Село / 1811–1817','Лицейское братство','Друзья, стихи и чувство свободы. Лицей становится целой вселенной — и остаётся с Пушкиным на всю жизнь.','p-lycee.jpg','Лицейский зал. Иллюстрация из материалов выставки'],
      ['Петербург / 1817–1820','Город произносит его имя','Литературные салоны, разговоры о свободе, молодость. Стихи расходятся по Петербургу, а поэт находит собственный голос.','p-lamp.jpg','«Зелёная лампа». Из материалов выставки'],
      ['Юг / 1820–1824','Изгнание как свобода','Вдали от столицы открывается другой мир. Южный свет, море и дорога становятся частью новой поэзии.','p-south.jpg','Иван Айвазовский. «Пушкин на берегу Чёрного моря»'],
      ['Михайловское / 1824–1826','Тишина, в которой слышно','Время уединения. Сказки, память, работа — и рождение строк, которым предстоит пережить свою эпоху.','p-mikhailovskoe.jpg','Николай Ге. «Александр Сергеевич Пушкин в селе Михайловском». 1875'],
      ['Возвращение / 1826–1830','Поэт и император','Встреча с властью и возвращение в столицу. Разговор о свободе продолжается — теперь на другом расстоянии.','p-winter.jpg','Александр Беггров. «Зимний Петербург»'],
      ['Болдино / 1830','Осень, ставшая вечностью','Внешний мир замирает, внутренний — набирает силу. Болдинская осень становится временем необычайного творческого подъёма.','nevsky-gold.jpg','Осенняя набережная. Атмосферный этюд из материалов проекта'],
      ['Любовь / 1830–1836','Натали','За знакомыми портретами — двое живых людей. Письма и голоса открывают личную сторону истории Пушкина и Натали.','p-nevsky.jpg','Дмитрий Белюкин. «Невский проспект у кондитерской Вольфа и Беранже»'],
      ['Петербург / 1837','Пушкин остаётся живым','История возвращается к последней зиме. Но её финал — голоса, память и строки, которые продолжают звучать.','p-duel.jpg','Дмитрий Белюкин. «Дуэль Пушкина. Протаптывают тропинку»']
    ];
    var chapterIndex=0;
    var chapterTabs=qa('[data-chapter]');
    var chapterImage=q('#px-chapter-image');
    var assetBase=chapterImage.getAttribute('src').replace(/[^/]+$/,'');
    function setChapter(index, focus) {
      chapterIndex=(index+chapters.length)%chapters.length;
      var data=chapters[chapterIndex];
      chapterTabs.forEach(function (tab,i) {tab.setAttribute('aria-selected',String(i===chapterIndex));tab.tabIndex=i===chapterIndex?0:-1;});
      q('#px-chapter-date').textContent=data[0];q('#px-chapter-title').textContent=data[1];q('#px-chapter-text').textContent=data[2];
      chapterImage.src=assetBase+data[3];chapterImage.alt=data[4];
      chapterImage.style.objectPosition='50% 50%';
      q('#px-chapter-panel').classList.toggle('px-chapter-portrait',chapterIndex===1);
      q('#px-chapter-credit').textContent=data[4];
      q('#px-chapter-count').textContent=chapterIndex===0?'Пролог / 10 эпизодов':String(chapterIndex).padStart(2,'0')+' / 10 эпизодов';
      q('#px-chapter-panel').setAttribute('aria-labelledby','px-tab-'+chapterIndex);
      var tab=chapterTabs[chapterIndex];
      var rail=q('.px-chapters');
      var left=tab.offsetLeft-rail.offsetLeft;
      if(left < rail.scrollLeft || left+tab.offsetWidth > rail.scrollLeft+rail.clientWidth) rail.scrollTo({left:Math.max(0,left-15),behavior:calm()?'auto':'smooth'});
      if (focus) tab.focus({preventScroll:true});
    }
    chapterTabs.forEach(function (tab,i) {tab.addEventListener('click',function(){setChapter(i,false);});tab.addEventListener('keydown',function(e){var index=i;if(e.key==='ArrowRight')index++;else if(e.key==='ArrowLeft')index--;else if(e.key==='Home')index=0;else if(e.key==='End')index=9;else return;e.preventDefault();setChapter(index,true);});});
    q('[data-next-chapter]').addEventListener('click',function(){setChapter(chapterIndex+1,false);});
    var menu=q('.px-menu-toggle');var nav=q('#px-nav');
    function closeMenu(returnFocus) {nav.classList.remove('is-open');menu.setAttribute('aria-expanded','false');if(returnFocus)menu.focus();}
    menu.addEventListener('click',function(){var open=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});
    root.addEventListener('keydown',function(e){if(e.key==='Escape'&&menu.getAttribute('aria-expanded')==='true'){closeMenu(true);}});
    root.addEventListener('focusout',function(){setTimeout(function(){if(!q('.px-header').contains(document.activeElement))closeMenu(false);},0);});
    root.addEventListener('click',function(e){if(!e.target.closest('.px-header'))closeMenu(false);});
    if(mobile.addEventListener)mobile.addEventListener('change',function(){closeMenu(false);});
    root.addEventListener('click',function(e){
      var link=e.target.closest('a[href^="#px-"]');if(!link)return;
      var target=document.getElementById(link.getAttribute('href').slice(1));if(!target||!root.contains(target))return;
      e.preventDefault();closeMenu(false);
      target.scrollIntoView({behavior:calm()?'auto':'smooth',block:'start'});
      if(!target.hasAttribute('tabindex')){target.setAttribute('tabindex','-1');target.addEventListener('blur',function(){target.removeAttribute('tabindex');},{once:true});}
      target.focus({preventScroll:true});
    });
    var config=window.PUSHKIN_EXHIBIT_CONFIG || {};
    if(typeof config.ticketUrl==='string' && /^https:\/\//i.test(config.ticketUrl.trim())){
      try {
        var ticketUrl=new URL(config.ticketUrl.trim());
        if(ticketUrl.protocol==='https:' && !ticketUrl.username && !ticketUrl.password){
          qa('[data-ticket-link]').forEach(function(link){link.href=ticketUrl.href;link.textContent='Купить билет ↗';});
          q('[data-buy-button]').href=ticketUrl.href;q('[data-buy-button]').hidden=false;
          q('[data-ticket-description]').textContent='Расписание сеансов — на странице продажи. Переходите, чтобы выбрать удобное время.';
          q('[data-ticket-note]').hidden=true;
        }
      }catch(ignore){}
    }
    var ticking=false;
    function progress(){ticking=false;var rect=root.getBoundingClientRect();var range=root.offsetHeight-window.innerHeight;var value=range>0?Math.min(1,Math.max(0,-rect.top/range)):0;root.style.setProperty('--px-progress',value.toFixed(4));}
    window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(progress);}},{passive:true});
    window.addEventListener('resize',progress,{passive:true});
    if('IntersectionObserver'in window && !calm()){
      var reveal=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.remove('px-reveal-pending');reveal.unobserve(entry.target);}});},{threshold:.08});
      qa('[data-reveal]').forEach(function(el){el.classList.add('px-reveal-pending');reveal.observe(el);});
    }
    updateMotion();progress();return true;
  }
  function start(){
    if(init())return;
    /* Поддерживает вставку HTML редактором после DOMContentLoaded. */
    watcher=new MutationObserver(function(){if(init()){watcher.disconnect();}});
    watcher.observe(document.documentElement,{childList:true,subtree:true});
    setTimeout(function(){if(watcher)watcher.disconnect();},30000);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
